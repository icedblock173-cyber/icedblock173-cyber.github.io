  var autoreloadToggle = document.getElementById('autoreloadToggle');
  try {
    autoreloadToggle.checked = localStorage.getItem('petittube_autoreload') === '1';
  } catch (e) {}
  autoreloadToggle.addEventListener('change', function() {
    try {
      localStorage.setItem('petittube_autoreload', autoreloadToggle.checked ? '1' : '0');
    } catch (e) {}
    // checking the box counts as a user gesture, so playback can start right away
    if (autoreloadToggle.checked && player) tryAutoplay();

  // the page is served with no-cache headers, so a plain navigation
  // always reaches the server and gets a new random video
  function loadNewVideo() {
    location.replace(location.pathname);
  }

  // start playback; if the browser blocks autoplay with sound,
  // fall back to muted playback so the flow never stops
  function tryAutoplay() {
    player.playVideo();
    setTimeout(function() {
      var s = player.getPlayerState ? player.getPlayerState() : -1;
      if (s !== YT.PlayerState.PLAYING && s !== YT.PlayerState.BUFFERING && s !== YT.PlayerState.ENDED) {
        forcedMute = true;
        player.mute();
        player.playVideo();
        // once playing, try to give the sound back if the viewer wanted it;
        // if the browser refuses, the video simply stays muted
        setTimeout(function() {
          if (forcedMute && localStorage.getItem('petittube_muted') !== '1'
              && player.getPlayerState() === YT.PlayerState.PLAYING) {
            player.unMute();
          }
        }, 1500);
      }
    }, 2000);
  }

  // keep volume and mute state from one video to the next ;

  var forcedMute = false;

      var muted = player.isMuted();
      if (!muted) forcedMute = false;
      if (!forcedMute) localStorage.setItem('petittube_muted', muted ? '1' : '0');
      localStorage.setItem('petittube_volume', player.getVolume());
    } catch (e) {}
  }

  function restoreVolume() {
    try {
      var vol = localStorage.getItem('petittube_volume');
      if (vol !== null) player.setVolume(parseInt(vol, 10));
      if (localStorage.getItem('petittube_muted') === '1') player.mute();
    } catch (e) {}
  }
