<html>
<head>
<link rel="stylesheet" href="main.css">
<script>
function parsedObject() {
    myTitle = document.getElementById("txtUsername").value;
    fetch('https://users.roproxy.com/v1/users/' + myTitle)
        .then(response => response.json())
        .then(data => {
            document.getElementById("output").innerHTML = data.name;
            joindate = data.created;
            document.getElementById("date").innerHTML =
                new Date(joindate).toLocaleDateString('en-us');
        })
        .catch(error => {
            console.error("Error:", error);
        });
}
</script>
</head>
<body>
<h1 class="navbar">Roblox Banned Account Finder</h1>
<div id="body"><div>
<div class="DarkGradientBox" style="height: 246px; text-align: center;">
                <div class="DGB_Header">
                    Member Login
                </div>
                <div class="DGB_Content">
                    <!-- Enter key submission hack - IE -->
                    <div style="padding-top: 4px; padding-bottom: 4px;">
                        <div style="margin-bottom: 7px;">
                        </div>
                        <label for="txtUsername" class="DGB_Label">
                            User ID:</label>
                            <input type="text" style="width: 120px;" class="DGB_TextBox" id="txtUsername" tabindex="1">
                    </div>
                    <div style="margin-top: 9px; text-align: center;">
                        <a class="DGB_Button" style="padding: 6px 0px 6px 0px; display: block; width: 110px; margin: 0 auto;" onclick="parsedObject()" href="#" tabindex="3">Find</a>
                    </div>
                </div>
            </div>
<div>
    <h1>User info</h1>
    <h3>Username: <b id=output></b></h3>
    <h3>Join Date: <b id=date></b></h3>
</div>
</body>
</html>
